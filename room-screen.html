<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOPALVERSE — Room Exploration Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --void: #04070C;
    --panel: #0B131C;
    --panel-alt: #0F1B26;
    --panel-border: #1C2E38;
    --white: #EAF2F5;
    --cyan: #2DE2E6;
    --cyan-dim: #0B6E77;
    --cyan-glow: rgba(45,226,230,0.35);
    --danger: #FF3B5C;
    --success: #39FF88;
    --boss-amber: #FFB020;
    --font-display: 'Orbitron', sans-serif;
    --font-body: 'Rajdhani', sans-serif;
    --font-mono: 'Share Tech Mono', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: radial-gradient(ellipse at 50% -10%, #0C1B22 0%, var(--void) 60%);
    color: var(--white);
    font-family: var(--font-body);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  .game-frame {
    width: 100%;
    max-width: 420px;
    background: var(--panel);
    border: 2px solid var(--panel-border);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 0 60px rgba(45,226,230,0.08), 0 20px 40px rgba(0,0,0,0.6);
    position: relative;
  }

  .scanlines {
    pointer-events: none;
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(to bottom, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 3px);
    z-index: 50;
    mix-blend-mode: overlay;
  }

  /* ---------- Top HUD ---------- */
  .hud {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 14px;
    border-bottom: 1px solid var(--panel-border);
    background: var(--panel-alt);
  }
  .hud-room {
    font-family: var(--font-display);
    font-size: 12px;
    color: var(--cyan);
    letter-spacing: 0.5px;
  }
  .hud-room span { color: rgba(234,242,245,0.5); font-size: 10px; display:block; margin-top:2px; }
  .hud-stats {
    display: flex;
    gap: 12px;
    font-family: var(--font-mono);
    font-size: 11px;
  }
  .hud-stats .stat { display: flex; align-items: center; gap: 4px; }
  .hud-stats .hp-icon { color: var(--danger); }
  .hud-stats .coin-icon { color: var(--boss-amber); }
  .hud-stats .key-icon { color: var(--cyan); }

  /* ---------- Room viewport ---------- */
  .room-viewport {
    position: relative;
    height: 300px;
    background:
      radial-gradient(circle at 15% 15%, rgba(45,226,230,0.06), transparent 45%),
      linear-gradient(180deg, #0A141C 0%, #060C12 100%);
    overflow: hidden;
  }

  .stars {
    position: absolute; inset: 0;
    background-image:
      radial-gradient(1px 1px at 30px 20px, rgba(255,255,255,0.4), transparent),
      radial-gradient(1px 1px at 120px 80px, rgba(255,255,255,0.3), transparent),
      radial-gradient(1.5px 1.5px at 200px 30px, rgba(255,255,255,0.5), transparent),
      radial-gradient(1px 1px at 280px 100px, rgba(255,255,255,0.3), transparent);
    opacity: 0.5;
  }

  .tile-grid {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    grid-template-rows: repeat(5, 1fr);
    padding: 10px;
    gap: 2px;
  }

  .tile {
    position: relative;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    background: rgba(255,255,255,0.015);
    transition: background 0.15s;
  }

  .tile.walkable { background: rgba(255,255,255,0.02); }
  .tile.wall {
    background: repeating-linear-gradient(135deg, rgba(28,46,56,0.6) 0 4px, rgba(15,27,38,0.6) 4px 8px);
    border: 1px solid var(--panel-border);
  }

  .tile.desk { filter: drop-shadow(0 0 4px rgba(255,59,92,0.4)); }
  .tile.desk .flicker { animation: deskFlicker 2.4s infinite; }
  @keyframes deskFlicker {
    0%, 100% { opacity: 1; }
    48% { opacity: 1; }
    50% { opacity: 0.3; }
    52% { opacity: 1; }
    78% { opacity: 1; }
    80% { opacity: 0.4; }
    82% { opacity: 1; }
  }

  .tile.enemy-tile { cursor: pointer; }
  .tile.enemy-tile .sprite-emoji {
    animation: enemyIdle 1.8s ease-in-out infinite;
    filter: drop-shadow(0 0 6px rgba(255,59,92,0.5));
  }
  @keyframes enemyIdle {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-3px); }
  }

  .tile.door-tile {
    font-size: 26px;
  }
  .tile.door-tile.locked { filter: drop-shadow(0 0 8px rgba(255,59,92,0.5)); }
  .tile.door-tile.unlocked {
    filter: drop-shadow(0 0 10px rgba(57,255,136,0.6));
    animation: doorPulse 1.4s infinite;
    cursor: pointer;
  }
  @keyframes doorPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }

  .tile .lock-badge {
    position: absolute;
    bottom: 1px; right: 1px;
    font-size: 9px;
  }

  .player-token {
    position: absolute;
    width: calc((100% - 20px) / 6 - 2px);
    height: calc((100% - 20px) / 5 - 2px);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    transition: top 0.18s ease, left 0.18s ease;
    z-index: 5;
    filter: drop-shadow(0 0 8px var(--cyan-glow));
  }

  .player-token.walk-anim { animation: bob 0.18s; }
  @keyframes bob {
    0% { transform: translateY(0); }
    50% { transform: translateY(-3px); }
    100% { transform: translateY(0); }
  }

  /* ---------- Encounter flash transition ---------- */
  .encounter-flash {
    position: absolute; inset: 0;
    background: var(--danger);
    opacity: 0;
    z-index: 40;
    pointer-events: none;
  }
  .encounter-flash.trigger {
    animation: flashSeq 0.5s;
  }
  @keyframes flashSeq {
    0% { opacity: 0; }
    20% { opacity: 0.85; }
    40% { opacity: 0; }
    60% { opacity: 0.85; }
    100% { opacity: 0; }
  }

  /* ---------- Message banner ---------- */
  .msg-banner {
    position: absolute;
    bottom: 8px; left: 8px; right: 8px;
    background: rgba(7,14,20,0.9);
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    padding: 8px 10px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--cyan);
    text-align: center;
    opacity: 0;
    transition: opacity 0.25s;
    z-index: 20;
  }
  .msg-banner.show { opacity: 1; }

  /* ---------- Controls ---------- */
  .controls {
    padding: 16px;
    background: var(--panel-alt);
    border-top: 1px solid var(--panel-border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .dpad {
    display: grid;
    grid-template-columns: 44px 44px 44px;
    grid-template-rows: 44px 44px 44px;
    gap: 4px;
  }
  .dpad button {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--cyan);
    font-size: 16px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.12s;
  }
  .dpad button:active { background: var(--cyan); color: var(--void); transform: scale(0.94); }
  .dpad .up { grid-column: 2; grid-row: 1; }
  .dpad .left { grid-column: 1; grid-row: 2; }
  .dpad .center { grid-column: 2; grid-row: 2; background: var(--panel-border); cursor: default; }
  .dpad .right { grid-column: 3; grid-row: 2; }
  .dpad .down { grid-column: 2; grid-row: 3; }

  .side-actions {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .side-actions button {
    background: none;
    border: 1px solid var(--panel-border);
    color: var(--white);
    font-family: var(--font-mono);
    font-size: 10px;
    padding: 8px 10px;
    border-radius: 6px;
    cursor: pointer;
    white-space: nowrap;
  }
  .side-actions button:hover { border-color: var(--cyan); color: var(--cyan); }

  .legend {
    display: flex;
    gap: 10px;
    padding: 8px 14px 14px;
    font-family: var(--font-mono);
    font-size: 9px;
    color: rgba(234,242,245,0.4);
    flex-wrap: wrap;
    border-top: 1px solid var(--panel-border);
    background: var(--panel-alt);
  }
</style>
</head>
<body>

<div class="game-frame">
  <div class="scanlines"></div>

  <div class="hud">
    <div class="hud-room">
      ROOM <span id="roomNum">03</span>
      <span id="roomLabel">Mixed difficulty · few enemies</span>
    </div>
    <div class="hud-stats">
      <div class="stat hp-icon">♥ <span id="hudHp">20</span></div>
      <div class="stat coin-icon">◆ <span id="hudCoin">0</span></div>
      <div class="stat key-icon">⚷ <span id="hudKeys">0</span></div>
    </div>
  </div>

  <div class="room-viewport">
    <div class="stars"></div>
    <div class="tile-grid" id="tileGrid"></div>
    <div class="player-token" id="playerToken">🧑‍🚀</div>
    <div class="encounter-flash" id="encounterFlash"></div>
    <div class="msg-banner" id="msgBanner"></div>
  </div>

  <div class="controls">
    <div class="dpad">
      <button class="up" onclick="tryMove(0,-1)">▲</button>
      <button class="left" onclick="tryMove(-1,0)">◀</button>
      <div class="center"></div>
      <button class="right" onclick="tryMove(1,0)">▶</button>
      <button class="down" onclick="tryMove(0,1)">▼</button>
    </div>
    <div class="side-actions">
      <button onclick="openPlayerWindow()">🎒 PLAYER WINDOW</button>
      <button onclick="resetRoom()">↻ RESET DEMO</button>
    </div>
  </div>

  <div class="legend">
    <span>👾 Enemy</span>
    <span>🖥️ Broken terminal</span>
    <span>🚪 Door (locked/open)</span>
    <span>🧑‍🚀 You</span>
  </div>
</div>

<script>
/* =========================================================
   PROTOTYPE — Room grid: 6 columns x 5 rows
   Tile types: floor, wall, desk (decor), enemy, door
   In the full build, room layout + enemy list comes from
   room-system.js (Room class) generated per roomNumber.
   ========================================================= */

const COLS = 6, ROWS = 5;

// 0 = floor, 1 = wall, 2 = desk(decor), 3 = enemy, 4 = door
let layout = [
  [1,1,1,4,1,1],
  [1,0,0,0,0,1],
  [1,0,2,0,3,1],
  [1,3,0,0,0,1],
  [1,1,0,0,1,1],
];

const doorPos = { x: 3, y: 0 };
let player = { x: 1, y: 3 };
let enemiesRemaining = 2;
let hasKeyForThisDoor = false;

const gameState = {
  hp: 20, maxHp: 20, coin: 12, keys: 1
};

function coordToIndex(x, y) { return y * COLS + x; }

function buildGrid() {
  const grid = document.getElementById("tileGrid");
  grid.innerHTML = "";
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      const val = layout[y][x];
      const tile = document.createElement("div");
      tile.className = "tile";
      tile.dataset.x = x;
      tile.dataset.y = y;

      if (val === 1) {
        tile.classList.add("wall");
      } else if (val === 2) {
        tile.classList.add("desk");
        tile.innerHTML = `<span class="flicker">🖥️</span>`;
      } else if (val === 3) {
        tile.classList.add("enemy-tile", "walkable");
        tile.innerHTML = `<span class="sprite-emoji">👾</span>`;
      } else if (val === 4) {
        const locked = enemiesRemaining > 0;
        tile.classList.add("door-tile", locked ? "locked" : "unlocked");
        tile.innerHTML = `🚪${locked ? '<span class="lock-badge">🔒</span>' : ''}`;
        if (!locked) tile.onclick = attemptDoor;
      } else {
        tile.classList.add("walkable");
      }
      grid.appendChild(tile);
    }
  }
}

function updatePlayerToken() {
  const token = document.getElementById("playerToken");
  const cellW = 100 / COLS, cellH = 100 / ROWS;
  token.style.left = `calc(${player.x * cellW}% + 10px)`;
  token.style.top = `calc(${player.y * cellH}% + 10px)`;
  token.classList.add("walk-anim");
  setTimeout(() => token.classList.remove("walk-anim"), 180);
}

function showMsg(text, ms = 1600) {
  const banner = document.getElementById("msgBanner");
  banner.textContent = text;
  banner.classList.add("show");
  clearTimeout(showMsg._t);
  showMsg._t = setTimeout(() => banner.classList.remove("show"), ms);
}

function updateHud() {
  document.getElementById("hudHp").textContent = gameState.hp;
  document.getElementById("hudCoin").textContent = gameState.coin;
  document.getElementById("hudKeys").textContent = gameState.keys;
}

function tryMove(dx, dy) {
  const nx = player.x + dx, ny = player.y + dy;
  if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) return;

  const targetVal = layout[ny][nx];
  if (targetVal === 1) {
    showMsg("A wall blocks the way.");
    return;
  }
  if (targetVal === 2) {
    showMsg("A broken terminal. Nothing useful here.");
    return;
  }
  if (targetVal === 4) {
    // moving onto door tile
    player.x = nx; player.y = ny;
    updatePlayerToken();
    attemptDoor();
    return;
  }
  if (targetVal === 3) {
    // encounter!
    triggerEncounter(nx, ny);
    return;
  }

  player.x = nx; player.y = ny;
  updatePlayerToken();
}

function triggerEncounter(ex, ey) {
  const flash = document.getElementById("encounterFlash");
  flash.classList.remove("trigger");
  void flash.offsetWidth; // restart animation
  flash.classList.add("trigger");

  showMsg("⚠ ENEMY ENCOUNTER! (Transitions to Battle Screen in the full build)", 2200);

  setTimeout(() => {
    // simulate defeating the enemy for demo purposes
    layout[ey][ex] = 0;
    enemiesRemaining -= 1;
    gameState.coin += 5;
    updateHud();
    buildGrid();
    showMsg(enemiesRemaining > 0
      ? `Enemy defeated! ${enemiesRemaining} enemy remaining. Door still locked.`
      : "All enemies cleared! The door has unlocked.", 2400);
  }, 500);
}

function attemptDoor() {
  if (enemiesRemaining > 0) {
    showMsg("🔒 Door is locked. Defeat all enemies in this room first.");
    return;
  }
  if (gameState.keys > 0) {
    gameState.keys -= 1;
    updateHud();
    showMsg("Door unlocked with a key! Proceeding to next room... (Room 4 loads in the full build)", 2400);
  } else {
    showMsg("You have no keys to open this door. Defeat enemies elsewhere to earn one.");
  }
}

function openPlayerWindow() {
  showMsg(`HP ${gameState.hp}/${gameState.maxHp} · Coin ${gameState.coin} · Keys ${gameState.keys} (Full Player Window UI comes in Phase 6)`, 2600);
}

function resetRoom() {
  layout = [
    [1,1,1,4,1,1],
    [1,0,0,0,0,1],
    [1,0,2,0,3,1],
    [1,3,0,0,0,1],
    [1,1,0,0,1,1],
  ];
  player = { x: 1, y: 3 };
  enemiesRemaining = 2;
  gameState.coin = 12;
  updateHud();
  buildGrid();
  updatePlayerToken();
  showMsg("Room reset.");
}

// keyboard support for desktop testing
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowUp") tryMove(0,-1);
  if (e.key === "ArrowDown") tryMove(0,1);
  if (e.key === "ArrowLeft") tryMove(-1,0);
  if (e.key === "ArrowRight") tryMove(1,0);
});

buildGrid();
updatePlayerToken();
updateHud();
</script>

</body>
</html>
